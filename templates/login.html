{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to see your support requests.</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="email">Email address</label>
      <input class="input" id="email" name="email" value="{{ email }}" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label>
      <div class="pw-wrap"><input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Show or hide password">Show</button></div></div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
